<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player {{ n }} Setup — Game of Life</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f0f7f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .progress {
      display: flex;
      gap: 6px;
      margin-bottom: 32px;
    }
    .pip {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #d0e8d4;
    }
    .pip.active { background: #1a6b2e; }
    h1 { font-size: 1.6rem; color: #1a6b2e; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 0.95rem; margin-bottom: 32px; }
    .field { margin-bottom: 24px; }
    label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #d0e8d4;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #1a6b2e; }
    .radio-group {
      display: flex;
      gap: 12px;
    }
    .radio-option {
      flex: 1;
      position: relative;
    }
    .radio-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
    }
    .radio-option label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border: 2px solid #d0e8d4;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
      font-size: 0.95rem;
    }
    .radio-option input:checked + label {
      border-color: #1a6b2e;
      background: #edf7ef;
      color: #1a6b2e;
    }
    .btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: #1a6b2e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #145523; }
  </style>
</head>
<body>
  <div class="card">
    <div class="progress">
      {% for i in range(1, num_players + 1) %}
        <div class="pip {% if i <= n %}active{% endif %}"></div>
      {% endfor %}
    </div>
    <h1>Player {{ n }}</h1>
    <p class="subtitle">Step {{ n }} of {{ num_players }}</p>
    <form method="post">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter name" required autofocus>
      </div>
      <div class="field">
        <label>Go to college?</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="college_yes" name="college" value="yes" checked>
            <label for="college_yes">🎓 Yes</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="college_no" name="college" value="no">
            <label for="college_no">🔧 No</label>
          </div>
        </div>
      </div>
      <div class="field">
        <label>Try to have kids?</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="kids_yes" name="kids" value="yes" checked>
            <label for="kids_yes">👶 Yes</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="kids_no" name="kids" value="no">
            <label for="kids_no">🙅 No</label>
          </div>
        </div>
      </div>
      <button class="btn" type="submit">
        {% if n < num_players %}Next Player →{% else %}Play the Game!{% endif %}
      </button>
    </form>
  </div>
</body>
</html>
